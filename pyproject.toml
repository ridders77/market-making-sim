[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mms"
version = "0.1.0"
description = "Market-making simulator: naive vs Avellaneda-Stoikov, calibrated to BTCUSDT"
requires-python = ">=3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
